name: DSP Parity (shared core)

on:
  push:
    paths:
      - 'shared/**'
      - '.github/workflows/dsp-parity.yml'
  pull_request:
    paths:
      - 'shared/**'
      - '.github/workflows/dsp-parity.yml'
  workflow_dispatch:

jobs:
  golden:
    name: Golden / SR-invariance / block-invariance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S shared -B shared/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build shared/build -j

      # Regenerate the reference on the runner with the frozen production DSP
      # (make_golden), so the comparison is platform-native and not affected by
      # libm differences between the committed (Windows) golden and this runner.
      - name: Regenerate platform-native golden
        run: ./shared/build/tests/make_golden shared/tests/golden

      - name: Run parity gate
        run: ctest --test-dir shared/build --output-on-failure
