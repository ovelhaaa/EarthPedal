<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title description">
  <title id="title">Apollo plugin interface</title>
  <desc id="description">Current Apollo plate reverb interface at its 900 by 620 default size, showing Reverb, Octave, Performance, and Output sections in the default parameter state.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#201e1b" stroke-width="1"/>
    </pattern>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30302f"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #f2eee8; }
      .group { fill: #151412; stroke: #5a554e; stroke-width: 1; rx: 5; }
      .group-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .label { font-size: 11px; text-anchor: middle; }
      .value { font-size: 11px; text-anchor: middle; fill: #ffa13b; }
      .muted { fill: #c8c0b7; }
      .control { fill: #1a1a1a; stroke: #444; }
      .button-on { fill: #ff6a00; stroke: #ffa13b; }
      .button-off { fill: #333; stroke: #111; }
      .button-text { font-size: 10px; text-anchor: middle; }
      .knob-body { fill: url(#knob); stroke: #222; stroke-width: 5; }
      .knob-arc { fill: none; stroke: #ff6a00; stroke-width: 3; stroke-linecap: round; filter: url(#glow); }
      .indicator { stroke: #fff; stroke-width: 3; stroke-linecap: round; }
      .octave-dim { opacity: .42; }
    </style>
  </defs>

  <rect width="900" height="620" fill="#131211"/>
  <rect width="900" height="620" fill="url(#grid)"/>

  <!-- Header -->
  <text x="20" y="43" fill="#ffa13b" font-size="26" font-weight="800" letter-spacing="1">APOLLO</text>
  <text x="190" y="38" font-size="12">Active — processing</text>
  <text x="880" y="38" class="muted" font-size="11" text-anchor="end">?  Contextual help</text>
  <rect x="20" y="54" width="860" height="1" fill="#ffa13b" opacity=".65"/>

  <!-- Main section frames mirror PluginEditor::resized() at 900 × 620. -->
  <rect class="group" x="20" y="76" width="500" height="330"/>
  <rect class="group" x="530" y="76" width="350" height="330"/>
  <rect class="group" x="20" y="406" width="500" height="190"/>
  <rect class="group" x="530" y="406" width="350" height="190"/>
  <rect x="35" y="70" width="70" height="14" fill="#131211"/>
  <rect x="545" y="70" width="58" height="14" fill="#131211"/>
  <rect x="35" y="400" width="68" height="14" fill="#131211"/>
  <rect x="545" y="400" width="108" height="14" fill="#131211"/>
  <text class="group-title" x="40" y="81">REVERB</text>
  <text class="group-title" x="550" y="81">OUTPUT</text>
  <text class="group-title" x="40" y="411">OCTAVE</text>
  <text class="group-title" x="550" y="411">PERFORMANCE</text>

  <!-- Reverb row 1 -->
  <g transform="translate(76 167)">
    <text class="label" y="-41">Pre-delay</text><circle class="knob-body" r="31"/>
    <path class="knob-arc" d="M-22 22 A31 31 0 0 1 -22 -22"/><line class="indicator" x1="0" y1="-15" x2="-12" y2="-24"/>
    <text class="value" y="51">0 ms</text>
  </g>
  <g transform="translate(158 167)">
    <text class="label" y="-41">Decay</text><circle class="knob-body" r="31"/>
    <path class="knob-arc" d="M-22 22 A31 31 0 1 1 24 18"/><line class="indicator" x1="0" y1="-15" x2="18" y2="-22"/>
    <text class="value" y="51">88%</text>
  </g>
  <g transform="translate(240 167)">
    <text class="label" y="-41">Tone</text><circle class="knob-body" r="31"/>
    <path class="knob-arc" d="M-22 22 A31 31 0 1 1 0 -31"/><line class="indicator" x1="0" y1="-15" x2="0" y2="-26"/>
    <text class="value" y="51">50%</text>
  </g>
  <text class="label" x="325" y="131">Size</text>
  <rect class="control" x="300" y="149" width="110" height="26" rx="4"/>
  <text x="310" y="167" font-size="11">Large</text><path d="M392 159l5 5 5-5" fill="none" stroke="#ff6a00" stroke-width="2"/>
  <rect class="button-on" x="410" y="149" width="95" height="26" rx="4"/>
  <text class="button-text" x="457.5" y="166" fill="#000">Input Diffusion — On</text>

  <!-- Reverb row 2 -->
  <g transform="translate(76 302)">
    <text class="label" y="-41">Mod Rate</text><circle class="knob-body" r="31"/>
    <path class="knob-arc" d="M-22 22 A31 31 0 0 1 -18 -25"/><line class="indicator" x1="0" y1="-15" x2="-10" y2="-24"/>
    <text class="value" y="51">5%</text>
  </g>
  <g transform="translate(158 302)">
    <text class="label" y="-41">Mod Depth</text><circle class="knob-body" r="31"/>
    <path class="knob-arc" d="M-22 22 A31 31 0 0 1 -16 -27"/><line class="indicator" x1="0" y1="-15" x2="-9" y2="-25"/>
    <text class="value" y="51">6%</text>
  </g>

  <!-- Octave: default Off, with dependent controls visibly attenuated. -->
  <text class="label" x="110" y="443">Octave Mode</text>
  <rect class="control" x="35" y="457" width="155" height="25" rx="4"/>
  <text x="46" y="474" font-size="11">Off</text><path d="M172 466l5 5 5-5" fill="none" stroke="#ff6a00" stroke-width="2"/>
  <text x="205" y="474" class="muted" font-size="11">OCTAVE OFF — controls remain automatable</text>
  <g class="octave-dim">
    <g transform="translate(97 540)">
      <text class="label" y="-37">Octave High Shelf</text><circle class="knob-body" r="27"/>
      <path class="knob-arc" d="M-19 19 A27 27 0 0 1 -8 -26"/><line class="indicator" x1="0" y1="-12" x2="-8" y2="-22"/>
      <text class="value" y="43">-11.0 dB</text>
    </g>
    <g transform="translate(222 540)">
      <text class="label" y="-37">Octave Low Shelf</text><circle class="knob-body" r="27"/>
      <path class="knob-arc" d="M-19 19 A27 27 0 1 1 12 -24"/><line class="indicator" x1="0" y1="-12" x2="8" y2="-22"/>
      <text class="value" y="43">5.0 dB</text>
    </g>
    <rect class="button-on" x="290" y="501" width="200" height="28" rx="4"/>
    <text class="button-text" x="390" y="519" fill="#000">Octave Dry Routing (pending) — On</text>
  </g>

  <!-- Performance -->
  <text class="label" x="620" y="450">Perform Action</text>
  <rect class="control" x="545" y="459" width="160" height="25" rx="4"/>
  <text x="556" y="476" font-size="11">Freeze</text><path d="M687 467l5 5 5-5" fill="none" stroke="#ff6a00" stroke-width="2"/>
  <rect class="button-off" x="725" y="458" width="135" height="32" rx="4"/>
  <text class="button-text muted" x="792.5" y="477">PERFORM / GATE — Freeze</text>
  <text class="muted" x="705" y="542" text-anchor="middle" font-size="11">Perform Ready</text>

  <!-- Output -->
  <text class="label" x="705" y="132" font-size="14">MIX</text>
  <rect x="662" y="151" width="6" height="190" rx="3" fill="#111"/>
  <rect x="662" y="246" width="6" height="95" rx="3" fill="#ff6a00" filter="url(#glow)"/>
  <rect x="652" y="240" width="26" height="12" rx="2" fill="#333" stroke="#fff"/>
  <line x1="659" y1="246" x2="671" y2="246" stroke="#fff"/>
  <text class="value" x="705" y="360">50%</text>
  <text class="label" x="574" y="371">DRY</text><text class="label" x="832" y="371">WET</text>
  <rect class="button-off" x="700" y="206" width="155" height="42" rx="4"/>
  <text x="777.5" y="232" class="button-text muted" font-size="15" font-weight="700">BYPASS — Off</text>

  <!-- Resize handle shown by JUCE's editor resizer. -->
  <path d="M882 612l10-10m-4 12 6-6" stroke="#5a554e" stroke-width="1.5"/>
</svg>
